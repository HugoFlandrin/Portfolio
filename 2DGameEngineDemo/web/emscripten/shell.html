<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1920" height="1080" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    // Must stay `var`, not `const`/`let`: the Emscripten-generated script
    // that follows also declares `var Module = ...` at the top level, and
    // redeclaring a `const`/`let` binding with `var` in the same scope is a
    // SyntaxError that silently kills the whole script (no console output).
    var Module = {
      canvas: document.getElementById("canvas"),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
